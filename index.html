  <script>
    (() => {
      const localeFontUrls = {
        vi: "https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap",
        ja: "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap"
      };
      let initialLocale = "vi";
      try {
        initialLocale = sessionStorage.getItem("andmore-locale") || "vi";
      } catch (error) {}
      if (!Object.hasOwn(localeFontUrls, initialLocale)) initialLocale = "vi";
      document.documentElement.lang = initialLocale;
      const fontLink = document.createElement("link");
      fontLink.id = "locale-fonts";
      fontLink.rel = "stylesheet";
      fontLink.href = localeFontUrls[initialLocale];
      document.head.append(fontLink);
    })();
  </script>

  <style>
    :root {
      --ink: #101418;
      --steel: #2E3A43;
      --road: #F2F4F3;
      --paper: #FFFFFF;
      --expressway: #0B6E4F;
      --hivis: #F0B429;
      --alert: #B3261E;
      --line: #D8DEDC;
    }

    [lang="vi"] {
      --font-display: "Be Vietnam Pro", system-ui, sans-serif;
      --font-body: "Be Vietnam Pro", system-ui, "Segoe UI", Roboto, sans-serif;
      --font-data: "IBM Plex Mono", ui-monospace, monospace;
    }

    [lang="ja"] {
      --font-display: "Zen Kaku Gothic New", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
      --font-body: "BIZ UDPGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      --font-data: "IBM Plex Mono", "BIZ UDPGothic", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--road);
      color: var(--ink);
      overflow-anchor: none;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--road);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.65;
      overflow-wrap: break-word;
      text-rendering: optimizeLegibility;
    }

    html[lang="ja"] body {
      line-height: 1.8;
      line-break: strict;
      word-break: normal;
      overflow-wrap: normal;
      font-feature-settings: "palt" 0;
      font-kerning: normal;
    }

    p,
    li,
    dd,
    figcaption {
      text-wrap: pretty;
    }

    h1,
    h2,
    h3,
    legend,
    summary {
      text-wrap: balance;
    }

    .nobr {
      white-space: nowrap;
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--hivis);
      outline-offset: 3px;
    }

    .container {
      width: min(100% - 48px, 1200px);
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      padding: 12px 16px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      background: var(--hivis);
      color: var(--ink);
      font-weight: 700;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .site-header {
      position: sticky;
      z-index: 50;
      top: 0;
      height: 64px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      transition: box-shadow 160ms ease;
    }

    .site-header.is-scrolled {
      box-shadow: 0 4px 16px rgb(16 20 24 / 12%);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      gap: 8px;
    }

    .brand {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .header-actions,
    .language-control,
    .call-link {
      display: flex;
      align-items: center;
    }

    .header-actions {
      gap: 6px;
    }

    .head-menu {
      display: none;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .head-menu > a,
    .menu-disclosure > summary {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      gap: 6px;
      padding-inline: 10px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .head-menu > a:hover,
    .menu-disclosure > summary:hover {
      color: var(--expressway);
    }

    .menu-disclosure {
      position: relative;
    }

    .menu-disclosure > summary {
      list-style: none;
    }

    .menu-disclosure > summary::-webkit-details-marker {
      display: none;
    }

    .menu-disclosure .chevron {
      width: 16px;
      height: 16px;
      transition: transform 160ms ease;
    }

    .menu-disclosure[open] .chevron {
      transform: rotate(180deg);
    }

    .menu-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 240px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      box-shadow: 0 12px 32px rgb(16 20 24 / 14%);
    }

    .menu-dropdown a {
      display: flex;
      min-height: 48px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 2px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .menu-dropdown a:hover,
    .menu-dropdown a:focus-visible {
      background: var(--road);
      color: var(--expressway);
    }

    .language-control {
      position: relative;
      min-height: 48px;
    }

    .language-control .ic {
      position: absolute;
      left: 10px;
      pointer-events: none;
    }

    .language-control .chevron {
      right: 10px;
      left: auto;
      width: 16px;
      height: 16px;
    }

    .language-control .language-select {
      appearance: none;
    }

    .language-select {
      width: 108px;
      min-height: 48px;
      padding: 0 26px 0 32px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .call-link {
      min-width: 48px;
      min-height: 48px;
      justify-content: center;
      gap: 8px;
      border-radius: 4px;
      background: var(--hivis);
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }

    .call-link[aria-disabled="true"] {
      cursor: not-allowed;
    }

    .call-label {
      display: none;
    }

    .ic {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: currentColor;
      stroke-width: 1.75;
    }

    ::selection {
      background: var(--hivis);
      color: var(--ink);
    }

    * {
      scrollbar-color: var(--steel) var(--road);
    }

    main {
      min-height: 48px;
    }

    .hero {
      padding-block: 48px;
      background: var(--road);
    }

    .hero-grid {
      display: grid;
      gap: 32px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .hero-title {
      max-width: 18ch;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-wrap: balance;
    }

    html[lang="ja"] .hero-title {
      max-width: 19ch;
      letter-spacing: 0;
      line-height: 1.35;
    }

    .hero-subtitle {
      max-width: 52ch;
      margin: 16px 0 0;
      color: var(--steel);
    }

    .primary-action {
      display: inline-flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      padding-inline: 20px;
      border-radius: 4px;
      background: var(--hivis);
      color: var(--ink);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: transform 120ms ease;
    }

    .primary-action:active {
      transform: scale(0.98);
    }

    .secondary-action {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      margin-top: 8px;
      color: var(--ink);
      font-weight: 600;
      text-underline-offset: 4px;
    }

    .hero-media {
      margin: 0;
    }

    .hero-image-frame {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--steel);
      border-radius: 4px;
      background: var(--steel);
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .workplace-media {
      margin: 40px 0 0;
    }

    .workplace-media img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 4px;
      object-fit: cover;
      object-position: center 58%;
    }

    .hero-image-frame.is-missing .hero-image {
      visibility: hidden;
    }

    .image-caption {
      margin-top: 8px;
      color: var(--steel);
      font-size: 13px;
      line-height: 1.5;
    }

    .trust-strip {
      border-block: 1px solid var(--line);
      background: var(--paper);
    }

    .trust-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .trust-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      min-height: 80px;
      align-items: center;
      gap: 12px;
      padding-block: 16px;
      color: var(--ink);
      font-weight: 600;
    }

    .trust-item + .trust-item {
      border-top: 1px solid var(--line);
    }

    .trust-item .ic {
      color: var(--expressway);
    }

    .eligibility {
      padding-block: 48px;
      border-bottom: 2px solid var(--steel);
      background: var(--road);
    }

    .section-marker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .section-marker::after {
      height: 1px;
      flex: 1;
      background: var(--line);
      content: "";
    }

    .section-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .section-subtitle {
      margin: 12px 0 0;
      color: var(--steel);
    }

    html[lang="ja"] .section-title,
    html[lang="ja"] .form-step-title,
    html[lang="ja"] .story-quote p,
    html[lang="ja"] .fraud-warning h2 {
      letter-spacing: 0;
      line-height: 1.5;
    }

    .inspection-sheet {
      margin-top: 32px;
      border: 2px solid var(--steel);
      border-radius: 0;
      background: var(--paper);
    }

    .inspection-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      padding: 20px 16px;
      border: 0;
      border-radius: 0;
      margin: 0;
      min-inline-size: 0;
    }

    .inspection-row + .inspection-row {
      border-top: 1px solid var(--line);
    }

    .inspection-number {
      padding-top: 2px;
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .inspection-content {
      min-width: 0;
    }

    .inspection-question {
      padding: 0;
      color: var(--ink);
      font-weight: 700;
    }

    .radio-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .radio-option {
      display: flex;
      min-height: 48px;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
    }

    .radio-option:has(input:checked) {
      border-color: var(--expressway);
      background: var(--road);
    }

    .radio-option input {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--expressway);
    }

    .eligibility-progress {
      margin: 16px 0 0;
      color: var(--steel);
      font-family: var(--font-data);
      font-size: 13px;
      line-height: 1.5;
    }

    .eligibility-result {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 24px;
      margin-top: 24px;
      padding: 24px;
      border: 2px solid var(--steel);
      border-radius: 4px;
      background: var(--paper);
    }

    .eligibility-result[hidden] {
      display: none;
    }

    .hanko {
      display: grid;
      width: 104px;
      height: 104px;
      place-items: center;
      border: 3px solid var(--stamp-color, var(--expressway));
      border-radius: 50%;
      color: var(--stamp-color, var(--expressway));
      font-family: "BIZ UDPGothic", "Noto Sans JP", sans-serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      text-align: center;
      transform: rotate(3deg);
      animation: hanko-stamp 260ms cubic-bezier(.34, 1.56, .64, 1);
    }

    .eligibility-result[data-status="eligible"] {
      --stamp-color: var(--expressway);
    }

    .eligibility-result[data-status="needs-review"] {
      --stamp-color: var(--hivis);
    }

    .eligibility-result[data-status="consultation"] {
      --stamp-color: var(--steel);
    }

    .result-heading {
      margin: 0 0 8px;
      color: var(--stamp-color);
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.3;
    }

    .result-message {
      margin: 0;
      color: var(--steel);
    }

    @keyframes hanko-stamp {
      from {
        opacity: 0;
        transform: scale(1.15) rotate(3deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(3deg);
      }
    }

    .content-section {
      padding-block: 48px;
      border-bottom: 2px solid var(--steel);
    }

    .content-section:nth-of-type(even) {
      background: var(--paper);
    }

    .inspection-heading {
      margin-bottom: 24px;
      padding-block: 8px;
      border-block: 1px solid var(--line);
    }

    .inspection-heading .section-marker {
      margin: 0;
    }

    .inspection-heading .section-marker::after {
      display: none;
    }

    .work-grid,
    .requirements-grid {
      display: grid;
      gap: 24px;
    }

    .timeline-list,
    .difficulty-list,
    .note-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 28px 56px 1fr;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
    }

    .timeline-item .ic {
      color: var(--expressway);
    }

    .timeline-time,
    .money,
    .data-input {
      font-family: var(--font-data);
      font-variant-numeric: tabular-nums;
    }

    .timeline-time {
      color: var(--steel);
      font-size: 13px;
      font-weight: 600;
    }

    .truth-panel,
    .information-panel,
    .warning-panel,
    .calculator-panel,
    .data-panel {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
    }

    .truth-panel,
    .calculator-panel,
    .data-panel {
      padding: 24px;
    }

    .truth-panel {
      border-color: var(--steel);
    }

    .panel-title {
      margin: 0 0 16px;
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .difficulty-list {
      display: grid;
      gap: 12px;
    }

    .difficulty-list li {
      position: relative;
      padding-left: 20px;
    }

    .difficulty-list li::before {
      position: absolute;
      left: 0;
      color: var(--expressway);
      content: "•";
    }

    .income-layout {
      display: grid;
      gap: 24px;
      margin-top: 32px;
    }

    .data-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      color: var(--ink);
    }

    .data-table th,
    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .data-table th {
      color: var(--steel);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .data-table td:last-child,
    .data-table th:last-child {
      text-align: right;
    }

    .data-table .summary-row td {
      border-top: 2px solid var(--steel);
      font-weight: 700;
    }

    .data-table .net-row td {
      padding-block: 20px;
      border-top: 3px double var(--steel);
      border-bottom: 0;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
    }

    .data-table .net-row .money {
      color: var(--expressway);
      font-size: 30px;
    }

    .money {
      white-space: nowrap;
    }

    .salary-table.motion-ready .salary-row {
      opacity: 0;
      transform: translateY(8px);
    }

    .salary-table.motion-ready .salary-row.is-visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 240ms ease, transform 240ms ease;
      transition-delay: var(--row-delay, 0ms);
    }

    .calculator-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: 21px;
      line-height: 1.3;
    }

    .calculator-title .ic {
      color: var(--expressway);
    }

    .calculator-description {
      margin: 0 0 20px;
      color: var(--steel);
      font-size: 15px;
      line-height: 1.6;
    }

    .calculator-fields {
      display: grid;
      gap: 16px;
    }

    .data-field {
      display: grid;
      gap: 6px;
    }

    .data-field label {
      font-size: 15px;
      font-weight: 600;
    }

    .data-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--steel);
      border-radius: 2px;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
    }

    .data-input::placeholder {
      color: var(--steel);
      opacity: 0.72;
    }

    .note-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
      color: var(--steel);
      font-size: 15px;
      line-height: 1.6;
    }

    .note-list li {
      padding-left: 18px;
      text-indent: -18px;
    }

    .cost-layout {
      display: grid;
      gap: 24px;
      margin-top: 32px;
    }

    .information-panel,
    .warning-panel {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 12px;
      padding: 20px;
    }

    .information-panel {
      border-color: var(--expressway);
    }

    .information-panel .ic {
      color: var(--expressway);
    }

    .warning-panel {
      border-color: var(--alert);
    }

    .warning-panel .ic {
      color: var(--alert);
    }

    .information-panel + .warning-panel,
    .requirements-grid + .information-panel {
      margin-top: 16px;
    }

    .information-panel p,
    .warning-panel p {
      margin: 0;
    }

    .requirements-grid {
      margin-top: 32px;
    }

    .requirements-table td:first-child {
      width: 64px;
      color: var(--expressway);
      font-family: var(--font-data);
      font-weight: 600;
      white-space: nowrap;
    }

    .requirements-table td:last-child {
      text-align: left;
    }

    .document-copy {
      margin: 0;
    }

    .roadmap-list {
      position: relative;
      display: grid;
      gap: 0;
      margin: 32px 0 0;
      padding: 0;
      list-style: none;
    }

    .roadmap-step {
      position: relative;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 16px;
      padding-bottom: 32px;
    }

    .roadmap-step:not(:last-child)::before {
      position: absolute;
      top: 48px;
      bottom: 0;
      left: 23px;
      width: 1px;
      background: var(--line);
      content: "";
    }

    .roadmap-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid var(--expressway);
      border-radius: 50%;
      background: var(--paper);
      color: var(--expressway);
    }

    .roadmap-card {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .roadmap-number,
    .roadmap-meta-label {
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .roadmap-name {
      margin: 4px 0 12px;
      font-family: var(--font-display);
      font-size: 21px;
      line-height: 1.3;
    }

    .roadmap-meta {
      display: grid;
      grid-template-columns: minmax(88px, auto) 1fr;
      gap: 8px 12px;
      margin: 0;
    }

    .roadmap-meta dt,
    .roadmap-meta dd {
      margin: 0;
    }

    .step-note {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--road);
    }

    .step-note p {
      margin: 0;
    }

    .roadmap-total {
      margin: 0;
      padding: 20px;
      border: 1px solid var(--steel);
      background: var(--paper);
      font-weight: 700;
    }

    .benefit-grid,
    .verification-list {
      display: grid;
      gap: 1px;
      margin: 32px 0 0;
      padding: 1px;
      background: var(--line);
      list-style: none;
    }

    .benefit-item,
    .verification-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      padding: 20px;
      background: var(--paper);
    }

    .benefit-item .ic,
    .verification-item .ic {
      color: var(--expressway);
    }

    .benefit-name {
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .family-note {
      margin-top: 24px;
      padding: 24px;
      border: 2px solid var(--steel);
      background: var(--paper);
      font-weight: 700;
    }

    .family-note p {
      margin: 0;
    }

    .company-layout {
      display: grid;
      gap: 32px;
      margin-top: 32px;
    }

    .company-legal {
      margin: 0;
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .verification-list {
      margin-top: 16px;
    }

    .verification-number {
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
    }

    .map-figure {
      margin: 0;
    }

    .map-link {
      display: block;
      text-decoration: none;
    }

    .map-frame {
      position: relative;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border: 1px solid var(--steel);
      background: var(--steel);
    }

    .map-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .map-frame.is-missing .map-image {
      visibility: hidden;
    }

    .map-action {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: var(--paper);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .demo-story {
      margin-top: 32px;
      border: 1px solid var(--steel);
      background: var(--paper);
    }

    .story-profile {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    .story-avatar {
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      border-radius: 50%;
      background: var(--expressway);
      color: var(--paper);
      font-family: var(--font-data);
      font-weight: 600;
    }

    .story-name,
    .story-meta {
      margin: 0;
    }

    .story-name {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
    }

    .story-meta {
      margin-top: 2px;
      color: var(--steel);
      font-size: 14px;
    }

    .story-badge {
      grid-column: 1 / -1;
      width: fit-content;
      padding: 6px 10px;
      border: 1px solid var(--hivis);
      border-radius: 999px;
      background: var(--hivis);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .story-quote {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 16px;
      margin: 0;
      padding: 28px 20px;
    }

    .story-quote .ic {
      color: var(--expressway);
    }

    .story-quote p {
      max-width: 62ch;
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(21px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.45;
    }

    .story-facts {
      display: grid;
      margin: 0;
      border-top: 1px solid var(--line);
    }

    .story-facts > div {
      padding: 16px 20px;
    }

    .story-facts > div + div {
      border-top: 1px solid var(--line);
    }

    .story-facts dt {
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .story-facts dd {
      margin: 6px 0 0;
      font-weight: 700;
    }

    .story-disclaimer {
      display: flex;
      max-width: 72ch;
      align-items: flex-start;
      gap: 10px;
      margin: 14px 0 0;
      color: var(--steel);
      font-size: 13px;
    }

    .story-disclaimer .ic {
      width: 16px;
      height: 16px;
      margin-top: 3px;
      color: var(--expressway);
    }

    .faq-list {
      margin-top: 32px;
      border-top: 1px solid var(--line);
    }

    .faq-item {
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .faq-question {
      display: grid;
      grid-template-columns: 32px 1fr 24px;
      min-height: 64px;
      align-items: center;
      gap: 12px;
      padding: 16px;
      cursor: pointer;
      font-weight: 700;
      list-style: none;
    }

    .faq-question::-webkit-details-marker {
      display: none;
    }

    .faq-number {
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: 13px;
    }

    .faq-question .ic {
      transition: transform 160ms ease;
    }

    .faq-item[open] .faq-question .ic {
      transform: rotate(180deg);
    }

    .faq-answer {
      max-width: 68ch;
      padding: 0 16px 20px 60px;
      color: var(--steel);
    }

    .faq-answer p {
      margin: 0;
    }

    .application-shell {
      margin-top: 32px;
      border: 2px solid var(--steel);
      background: var(--paper);
    }

    .form-progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .form-progress li {
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
      color: var(--steel);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .form-progress li + li {
      border-left: 1px solid var(--line);
    }

    .form-progress li.is-current {
      border-bottom: 3px solid var(--expressway);
      color: var(--expressway);
    }

    .form-panel {
      padding: 24px;
    }

    .form-panel[hidden],
    .application-success[hidden] {
      display: none;
    }

    .form-step-title {
      margin: 0 0 24px;
      font-family: var(--font-display);
      font-size: 21px;
      line-height: 1.3;
    }

    .form-grid {
      display: grid;
      gap: 20px;
    }

    .form-field,
    .choice-fieldset {
      display: grid;
      gap: 6px;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .form-label,
    .choice-legend {
      padding: 0;
      font-weight: 700;
    }

    .field-example,
    .field-help {
      margin: 0;
      color: var(--steel);
      font-size: 13px;
      line-height: 1.5;
    }

    .form-control {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--steel);
      border-radius: 2px;
      background: var(--paper);
      color: var(--ink);
    }

    .form-control[aria-invalid="true"] {
      border-color: var(--alert);
    }

    .field-error {
      min-height: 20px;
      margin: 0;
      color: var(--alert);
      font-size: 13px;
      line-height: 1.5;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .choice-card {
      display: flex;
      min-height: 48px;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
    }

    .choice-card:has(input:checked) {
      border-color: var(--expressway);
      background: var(--road);
    }

    .choice-card input,
    .consent-row input {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      accent-color: var(--expressway);
    }

    .choice-card .ic {
      color: var(--expressway);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .form-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--steel);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .form-button.primary {
      min-height: 56px;
      border-color: var(--hivis);
      background: var(--hivis);
    }

    .form-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .skip-documents-note {
      margin: 0 0 24px;
      padding: 16px;
      border: 1px solid var(--line);
      background: var(--road);
    }

    .document-upload-list {
      display: grid;
      gap: 16px;
    }

    .upload-card {
      padding: 16px;
      border: 1px solid var(--line);
    }

    .upload-card-title {
      margin: 0 0 4px;
      font-weight: 700;
    }

    .upload-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .file-list {
      display: grid;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .file-item {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: var(--road);
    }

    .file-preview {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      overflow: hidden;
      background: var(--steel);
      color: var(--paper);
    }

    .file-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: var(--steel);
      font-family: var(--font-data);
      font-size: 13px;
    }

    .file-progress {
      width: 100%;
      height: 4px;
      border: 0;
      accent-color: var(--expressway);
    }

    .icon-button {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--alert);
      cursor: pointer;
    }

    .consent-list {
      display: grid;
      gap: 12px;
    }

    .consent-row {
      display: flex;
      min-height: 48px;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
    }

    .retention-note {
      margin: 16px 0 24px;
      color: var(--steel);
    }

    .schedule-panel {
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--road);
    }

    .schedule-panel h3 {
      margin: 0 0 16px;
      font-family: var(--font-display);
      font-size: 21px;
    }

    .dual-time {
      margin: 12px 0 0;
      font-family: var(--font-data);
      font-size: 15px;
    }

    .application-success {
      padding: 32px 24px;
      text-align: center;
    }

    .receipt-label {
      margin: 24px 0 8px;
      color: var(--steel);
    }

    .receipt-code {
      margin: 0;
      color: var(--expressway);
      font-family: var(--font-data);
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .success-next {
      max-width: 58ch;
      margin: 24px auto;
      color: var(--steel);
    }

    .sticky-actions {
      position: fixed;
      z-index: 45;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: minmax(0, 3fr) 56px 56px;
      min-height: 64px;
      gap: 4px;
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
      border-top: 2px solid var(--steel);
      background: var(--paper);
      transform: translateY(110%);
      transition: transform 160ms ease;
    }

    .sticky-actions.is-visible {
      transform: translateY(0);
    }

    .sticky-main,
    .sticky-secondary {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .sticky-main {
      background: var(--hivis);
    }

    .sticky-secondary {
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .loader-icon {
      animation: loader-spin 800ms linear infinite;
    }

    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }

    .site-footer {
      border-top: 2px solid var(--steel);
      background: var(--ink);
      color: var(--road);
    }

    .footer-inner {
      padding-block: 48px 32px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    .footer-heading {
      margin: 0 0 12px;
      color: var(--paper);
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .footer-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .footer-list a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      color: var(--road);
      text-underline-offset: 4px;
    }

    .fraud-warning {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      margin-top: 48px;
      padding: 24px;
      border: 1px solid var(--alert);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
    }

    .fraud-warning h2 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: 21px;
      line-height: 1.3;
    }

    .fraud-warning p {
      max-width: 68ch;
      margin: 0;
    }

    .fraud-warning .ic {
      color: var(--alert);
    }

    .company-meta {
      display: grid;
      gap: 16px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--steel);
      color: var(--line);
      font-size: 13px;
    }

    .company-meta p {
      margin: 0;
    }

    .footer-language {
      width: 172px;
      min-width: 172px;
      max-width: 100%;
      padding: 0 38px 0 16px;
      border-color: var(--steel);
      background: var(--ink);
      color: var(--paper);
      font-size: 14px;
    }

    .demo-credit {
      margin-top: 12px !important;
      color: var(--line);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .demo-credit a {
      text-decoration-color: rgb(216 222 220 / 52%);
      text-underline-offset: 3px;
    }

    .demo-credit a:hover {
      color: var(--paper);
      text-decoration-color: currentColor;
    }

    @media (min-width: 768px) {
      .container {
        width: min(100% - 64px, 1200px);
      }

      .call-link {
        padding-inline: 16px;
      }

      .header-inner {
        gap: 20px;
      }

      .header-actions {
        gap: 14px;
      }

      .call-label {
        display: inline;
      }

      .language-select {
        width: 144px;
        padding: 0 30px 0 38px;
        font-size: 15px;
      }

      .hero {
        padding-block: 96px;
      }

      .hero-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: 48px;
      }

      .primary-action {
        width: auto;
      }

      .trust-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .trust-item {
        min-height: 112px;
        padding: 24px;
      }

      .trust-item + .trust-item {
        border-top: 0;
        border-left: 1px solid var(--line);
      }

      .eligibility {
        padding-block: 96px;
      }

      .content-section {
        padding-block: 96px;
      }

      .inspection-row {
        grid-template-columns: 56px minmax(0, 1fr);
        padding: 24px;
      }

      .radio-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .work-grid,
      .income-layout,
      .cost-layout,
      .requirements-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px;
      }

      .calculator-fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .benefit-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .story-profile {
        grid-template-columns: 56px minmax(0, 1fr) auto;
        padding: 24px 28px;
      }

      .story-badge {
        grid-column: auto;
      }

      .story-quote {
        padding: 40px 28px;
      }

      .story-facts {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .story-facts > div {
        padding: 20px 28px;
      }

      .story-facts > div + div {
        border-top: 0;
        border-left: 1px solid var(--line);
      }

      .company-layout {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      }

      .form-panel {
        padding: 32px;
      }

      .form-grid.two-columns,
      .choice-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .sticky-actions {
        display: none;
      }

      .footer-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .company-meta {
        grid-template-columns: 1fr auto;
        align-items: end;
      }

      .workplace-media {
        width: min(100%, 960px);
        margin: 56px auto 0;
      }

      .workplace-media img {
        aspect-ratio: 16 / 7;
      }
    }

    @media (min-width: 900px) and (max-width: 1199px) {
      .site-header {
        height: 120px;
      }

      .header-inner {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: 64px 56px;
        column-gap: 24px;
        row-gap: 0;
      }

      .head-menu {
        display: flex;
        grid-column: 1 / -1;
        grid-row: 2;
        justify-content: center;
        align-self: stretch;
        margin-left: 0;
        border-top: 1px solid var(--line);
      }

      .header-actions {
        grid-column: 2;
        grid-row: 1;
        margin-left: 0;
        gap: 14px;
      }

      .header-actions .language-select {
        width: 148px;
        font-size: 14px;
      }

      .head-menu > a,
      .menu-disclosure > summary {
        min-height: 55px;
        padding-inline: 20px;
        font-size: 14px;
      }
    }

    @media (min-width: 1024px) {
      .footer-inner {
        padding-block: 96px 32px;
      }

      .footer-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (min-width: 1200px) {
      .site-header {
        height: 72px;
      }

      .header-inner {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 18px;
      }

      .head-menu {
        display: flex;
        justify-content: center;
        margin-left: 0;
      }

      .head-menu > a,
      .menu-disclosure > summary {
        padding-inline: 14px;
      }

      .header-actions {
        margin-left: 0;
        padding-left: 20px;
        border-left: 1px solid var(--line);
        gap: 18px;
      }

      .header-actions .language-select {
        width: 148px;
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="common.skipToContent"></a>

  <header class="site-header" data-section="S0">
    <div class="container header-inner">

  <main id="main-content" tabindex="-1">
    <section class="hero" data-section="S1" aria-labelledby="hero-title">

          </div>
          <figcaption class="image-caption" data-i18n="hero.imageCaption"></figcaption>
        </figure>
      </div>
    </section>

    <section class="trust-strip" data-section="S2" data-i18n-aria-label="trust.label">

          <li class="trust-item">
            <i data-lucide="arrow-right-left" class="ic" aria-hidden="true"></i>
            <span data-i18n="trust.direct"></span>
          </li>
          <li class="trust-item">
            <i data-lucide="banknote" class="ic" aria-hidden="true"></i>
            <span data-i18n="trust.costs"></span>
          </li>
          <li class="trust-item">
            <i data-lucide="search-check" class="ic" aria-hidden="true"></i>
            <span data-i18n="trust.status"></span>
          </li>
        </ul>
      </div>
    </section>

    <script>
      (() => {
        let locale = "vi";
        try {
          locale = sessionStorage.getItem("andmore-locale") || "vi";
        } catch (error) {}
        if (!Object.hasOwn(i18n, locale)) locale = "vi";
        const valueFor = (key) => key.split(".").reduce((value, part) => value && value[part], i18n[locale]);
        document.documentElement.lang = locale;
        document.title = valueFor("common.pageTitle");
        document.querySelector('meta[name="description"]').content = valueFor("common.pageDescription");
        document.querySelectorAll('.skip-link[data-i18n], .site-header [data-i18n], [data-section="S1"] [data-i18n], [data-section="S2"] [data-i18n]').forEach((element) => {
          const value = valueFor(element.dataset.i18n);
          if (typeof value === "string") element.textContent = value;
        });
        document.querySelector('[data-section="S2"]').setAttribute("aria-label", valueFor("trust.label"));
        document.querySelectorAll("[data-locale-select]").forEach((select) => {
          select.value = locale;
          select.setAttribute("aria-label", valueFor("common.languageLabel"));
        });
      })();
    </script>

    <section class="eligibility" id="eligibility" data-section="S3" aria-labelledby="eligibility-title">

        <form class="inspection-sheet" data-eligibility-form>

                <label class="radio-option"><input type="radio" name="age" value="under20"><span data-i18n="eligibility.options.age.under20"></span></label>

                <label class="radio-option"><input type="radio" name="age" value="40plus"><span data-i18n="eligibility.options.age.40plus"></span></label>
              </div>

          </fieldset>

                <label class="radio-option"><input type="radio" name="experience" value="under1"><span data-i18n="eligibility.options.experience.under1"></span></label>
                <label class="radio-option"><input type="radio" name="experience" value="1to2"><span data-i18n="eligibility.options.experience.1to2"></span></label>

                <label class="radio-option"><input type="radio" name="japanese" value="n5"><span data-i18n="eligibility.options.japanese.n5"></span></label>
                <label class="radio-option"><input type="radio" name="japanese" value="n4"><span data-i18n="eligibility.options.japanese.n4"></span></label>
                <label class="radio-option"><input type="radio" name="japanese" value="n3"><span data-i18n="eligibility.options.japanese.n3"></span></label>

              <div class="data-field"><label for="salary-utilities" data-i18n="income.calculator.utilities"></label><input class="data-input" id="salary-utilities" name="utilities" type="number" min="0" value="10000" inputmode="numeric" data-i18n-placeholder="income.calculator.placeholder"></div>

        </ul>
      </div>
    </section>

    <section class="content-section" data-section="S6" aria-labelledby="cost-title">
      <div class="container">
        <div class="inspection-heading"><p class="section-marker" data-i18n="costs.marker"></p></div>
        <h2 class="section-title" id="cost-title" data-i18n="costs.title"></h2>
        <div class="cost-layout">
          <div class="data-table-wrap">
            <table class="data-table">

    const japaneseNoBreakPhrases = ["特定技能1号", "JFT-Basic", "自動車運送業", "外国免許切替"];

    function setLocalizedText(element, value, locale) {
      element.textContent = "";
      if (locale !== "ja" || !japaneseNoBreakPhrases.some((phrase) => value.includes(phrase))) {
        element.textContent = value;
        return;
      }

      const phrasePattern = new RegExp(`(${japaneseNoBreakPhrases.join("|")})`, "g");
      value.split(phrasePattern).filter(Boolean).forEach((part) => {
        if (japaneseNoBreakPhrases.includes(part)) {
          const span = document.createElement("span");
          span.className = "nobr";
          span.lang = "ja";
          span.textContent = part;
          element.append(span);
        } else {
          element.append(document.createTextNode(part));
        }
      });
    }

    function evaluateEligibility(answers) {
      const consultationReasons = [];
      const missingRequirements = [];

      if (answers.license === "none") {
        consultationReasons.push("license");
      } else if (answers.license === "b2") {
        missingRequirements.push("license");
      }

      if (!["n4", "n3", "jft"].includes(answers.japanese)) {
        missingRequirements.push("japanese");
      }

      if (answers.skillExam !== "passed") {
        missingRequirements.push("skillExam");
      }

      if (answers.health === "concern") {
        consultationReasons.push("health");
      } else if (answers.health === "needsExam") {
        missingRequirements.push("health");
      }

      if (answers.residence === "needsReview") {
        consultationReasons.push("residence");
      }

      if (consultationReasons.length) {
        return {
          status: "consultation",
          consultationReasons,
          missingRequirements
        };
      }

      if (missingRequirements.length) {
        return {
          status: "needs-review",
          consultationReasons,
          missingRequirements
        };
      }

      return {
        status: "eligible",
        consultationReasons,
        missingRequirements
      };
    }

      const form = document.querySelector("[data-eligibility-form]");
      if (!form) return {};
      return Object.fromEntries(new FormData(form).entries());

      const resultKey = result.status === "needs-review" ? "needsReview" : result.status;
      const copy = getTranslation(locale, `eligibility.results.${resultKey}`);
      const message = result.status === "needs-review"
        ? copy.message.replaceAll("{{n}}", String(result.missingRequirements.length))

      stamp.textContent = copy.stamp;

      const messageElement = document.createElement("p");

    function updateEligibilityDisplay() {
      const form = document.querySelector("[data-eligibility-form]");
      if (!form) return;

      const answers = getEligibilityAnswers();
      const answeredCount = Object.keys(answers).length;
      const locale = document.documentElement.lang;
      const progress = document.querySelector("[data-eligibility-progress]");
      const resultContainer = document.querySelector("[data-eligibility-result]");

      progress.textContent = getTranslation(locale, "eligibility.progress").replace("{{count}}", String(answeredCount));

      if (answeredCount < 7) {
        resultContainer.hidden = true;
        resultContainer.replaceChildren();
        delete resultContainer.dataset.status;
        return;
      }

      renderEligibilityResult(evaluateEligibility(answers), locale);
    }

    function readCalculatorNumber(form, name) {
      const value = form.elements[name].value.trim();
      if (value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) && number >= 0 ? number : null;
    }

    function formatMoney(value, currency, locale) {
      if (value === null || !Number.isFinite(value)) {
        return `${locale === "ja" ? "未入力" : "Chưa nhập"} ${currency}`;
      }

      const localeCode = locale === "ja" ? "ja-JP" : "vi-VN";
      return `${new Intl.NumberFormat(localeCode, { maximumFractionDigits: 0 }).format(Math.round(value))} ${currency}`;
    }

    function updateSalaryCalculator() {
      const form = document.querySelector("[data-salary-calculator]");
      if (!form) return;

      const locale = document.documentElement.lang;
      const values = {
        base: readCalculatorNumber(form, "base"),
        hours: readCalculatorNumber(form, "hours"),
        overtimeRate: readCalculatorNumber(form, "overtimeRate"),
        allowance: readCalculatorNumber(form, "allowance"),
        insurance: readCalculatorNumber(form, "insurance"),
        tax: readCalculatorNumber(form, "tax"),
        housing: readCalculatorNumber(form, "housing"),
        utilities: readCalculatorNumber(form, "utilities"),
        exchangeRate: readCalculatorNumber(form, "exchangeRate")
      };

      const overtime = values.hours !== null && values.overtimeRate !== null
        ? values.hours * values.overtimeRate
        : null;
      const gross = [values.base, overtime, values.allowance].every((value) => value !== null)
        ? values.base + overtime + values.allowance
        : null;
      const deductions = [values.insurance, values.tax, values.housing, values.utilities];
      const net = gross !== null && deductions.every((value) => value !== null)
        ? gross - deductions.reduce((sum, value) => sum + value, 0)
        : null;
      const equivalent = net !== null && values.exchangeRate !== null
        ? net * values.exchangeRate
        : null;
      const outputs = {
        base: values.base,
        overtime,
        allowance: values.allowance,
        gross,
        insurance: values.insurance,
        tax: values.tax,
        housing: values.housing,
        utilities: values.utilities,
        net,
        equivalent
      };

      Object.entries(outputs).forEach(([key, value]) => {
        const currency = key === "equivalent" ? "₫" : "¥";
        document.querySelector(`[data-salary-output="${key}"]`).textContent = formatMoney(value, currency, locale);
      });

      const overtimeHours = values.hours === null ? (locale === "ja" ? "未入力" : "chưa nhập") : new Intl.NumberFormat(locale === "ja" ? "ja-JP" : "vi-VN").format(values.hours);
      document.querySelector("[data-salary-overtime-label]").textContent = getTranslation(locale, "income.rows.overtime").replace("{{n}}", overtimeHours);
    }

    function setupSalaryReveal() {
      const table = document.querySelector("[data-salary-table]");
      if (!table) return;

      const rows = [...table.querySelectorAll(".salary-row")];
      const reveal = () => {
        rows.forEach((row, index) => {
          row.style.setProperty("--row-delay", index < 6 ? `${index * 40}ms` : "0ms");
          row.classList.add("is-visible");
        });
      };

      table.classList.add("motion-ready");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
        reveal();
        return;
      }

      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          reveal();
          observer.disconnect();
        }
      }, { threshold: 0.15 });
      observer.observe(table);
    }

          preview.append(icon);

        name.className = "file-name";
        name.textContent = entry.file.name;
        const size = document.createElement("div");
        size.className = "file-size";

        const progress = document.createElement("progress");

        actions.className = "upload-actions";
        const chooseId = `file-${documentConfig.key}`;
        const cameraId = `camera-${documentConfig.key}`;
        const choose = document.createElement("input");
        choose.className = "file-input";
        choose.id = chooseId;
        choose.type = "file";
        choose.multiple = true;
        choose.accept = marketConfig.upload.accept;
        choose.dataset.documentKey = documentConfig.key;
        const chooseLabel = document.createElement("label");
        chooseLabel.className = "form-button";
        chooseLabel.htmlFor = chooseId;
        chooseLabel.textContent = getTranslation(locale, "application.step2.choose");
        const camera = document.createElement("input");
        camera.className = "file-input";
        camera.id = cameraId;
        camera.type = "file";
        camera.accept = "image/*";
        camera.setAttribute("capture", "environment");
        camera.dataset.documentKey = documentConfig.key;
        const cameraLabel = document.createElement("label");
        cameraLabel.className = "form-button";
        cameraLabel.htmlFor = cameraId;
        cameraLabel.textContent = getTranslation(locale, "application.step2.camera");
        actions.append(choose, chooseLabel, camera, cameraLabel);
        const fileList = document.createElement("ul");
        fileList.className = "file-list";
        fileList.dataset.fileList = documentConfig.key;
        card.append(actions, fileList);
        container.append(card);
      });

      const demoNote = document.createElement("p");
      demoNote.className = "field-help";
      demoNote.textContent = getTranslation(locale, "application.step2.uploadDemo");
      container.append(demoNote);
      [...uploadedFiles.keys()].forEach((key) => renderFileList(key, locale));
    }

    function showUploadError(key) {
      document.querySelector("[data-upload-error]").textContent = key ? getTranslation(document.documentElement.lang, key) : "";
    }

    function addFiles(documentKey, fileList) {
      const locale = document.documentElement.lang;
      const current = uploadedFiles.get(documentKey) || [];
      const nextFiles = [...fileList];
      if (current.length + nextFiles.length > marketConfig.upload.maxFilesPerDocument) {
        showUploadError("application.step2.fileLimit");
        return;
      }
      for (const file of nextFiles) {
        const extension = file.name.split(".").pop().toLowerCase();
        if (!marketConfig.upload.allowedExtensions.includes(extension)) {
          showUploadError("application.step2.fileType");
          return;
        }
        if (file.size > marketConfig.upload.maxFileBytes) {
          showUploadError("application.step2.fileTooLarge");
          return;
        }
      }
      const addedBytes = nextFiles.reduce((sum, file) => sum + file.size, 0);
      if (getTotalUploadBytes() + addedBytes > marketConfig.upload.maxTotalBytes) {
        showUploadError("application.step2.totalLimit");
        return;
      }
      const entries = nextFiles.map((file) => ({
        file,
        url: file.type.startsWith("image/") && !/\.hei[cf]$/i.test(file.name) ? URL.createObjectURL(file) : ""
      }));
      uploadedFiles.set(documentKey, [...current, ...entries]);
      showUploadError("");
      renderFileList(documentKey, locale);
    }

    function setFieldError(name, message) {
      const error = document.querySelector(`[data-error-for="${name}"]`);
      const fields = applicationForm.querySelectorAll(`[name="${name}"]`);
      if (error) error.textContent = message;
      fields.forEach((field) => field.setAttribute("aria-invalid", message ? "true" : "false"));
    }

    function validateApplicationField(name) {
      const locale = document.documentElement.lang;
      const fields = [...applicationForm.querySelectorAll(`[name="${name}"]`)];
      if (!fields.length) return true;
      let valid = true;
      let errorKey = "application.validation.required";

      if (fields[0].type === "radio") {
        valid = fields.some((field) => field.checked);
      } else if (fields[0].type === "checkbox") {
        valid = !fields[0].required || fields[0].checked;
        errorKey = "application.validation.consent";
      } else {
        valid = fields[0].value.trim() !== "";
      }

      if (valid && name === "fullName") {
        valid = fields[0].value.trim().length >= 2;
        errorKey = "application.validation.fullName";
      }
      if (valid && name === "phone") {
        const normalized = fields[0].value.replace(/[\s().-]/g, "");
        valid = new RegExp(marketConfig.formRules.phonePattern).test(normalized);
        errorKey = "application.validation.phone";
      }
      setFieldError(name, valid ? "" : getTranslation(locale, errorKey));
      return valid;
    }

    function validateStep(step) {
      const names = step === 1
        ? ["fullName", "birthYear", "phone", "province", "occupation", "appLicense"]
        : ["consentProcessing", "consentTransfer"];
      const valid = names.map(validateApplicationField).every(Boolean);
      if (!valid) {
        const firstInvalid = applicationForm.querySelector('[aria-invalid="true"]');
        firstInvalid?.focus();
      }
      return valid;
    }

    function showFormStep(step) {
      currentFormStep = step;
      document.querySelectorAll("[data-form-step]").forEach((panel) => {
        panel.hidden = Number(panel.dataset.formStep) !== step;
      });
      document.querySelectorAll("[data-progress-step]").forEach((item) => {
        item.classList.toggle("is-current", Number(item.dataset.progressStep) === step);
      });
      if (step === 2) renderDocumentUploads(document.documentElement.lang);
      document.querySelector(`[data-form-step="${step}"]`)?.focus({ preventScroll: true });
      saveApplicationDraft();
    }

    function saveApplicationDraft() {
      const draft = {};
      new FormData(applicationForm).forEach((value, key) => {
        if (!(value instanceof File)) draft[key] = value;
      });
      draft.currentFormStep = currentFormStep;
      try {
        sessionStorage.setItem("andmore-application-draft", JSON.stringify(draft));
      } catch (error) {}
    }

    function restoreApplicationDraft() {
      let draft = null;
      try {
        draft = JSON.parse(sessionStorage.getItem("andmore-application-draft"));
      } catch (error) {}
      if (!draft) return;
      Object.entries(draft).forEach(([name, value]) => {
        if (name === "currentFormStep") return;
        const fields = [...applicationForm.querySelectorAll(`[name="${name}"]`)];
        fields.forEach((field) => {
          if (field.type === "radio" || field.type === "checkbox") field.checked = field.value === value || value === "on";
          else field.value = value;
        });
      });
      currentFormStep = Math.min(3, Math.max(1, Number(draft.currentFormStep) || 1));
    }

    function updateDualTime() {
      const input = applicationForm.elements.interviewTime;
      const output = document.querySelector("[data-dual-time]");
      const locale = document.documentElement.lang;
      if (!input.value) {
        const pendingTime = locale === "ja" ? "未選択" : "Chưa chọn";
        output.textContent = getTranslation(locale, "application.step3.dualTime").replace("{{vn}}", pendingTime).replace("{{jp}}", pendingTime);
        return;
      }
      const [datePart, timePart] = input.value.split("T");
      const [year, month, day] = datePart.split("-").map(Number);
      const [hour, minute] = timePart.split(":").map(Number);
      const instant = new Date(Date.UTC(year, month - 1, day, hour - 7, minute));
      const formatter = (timeZone) => new Intl.DateTimeFormat(locale === "ja" ? "ja-JP" : "vi-VN", {
        dateStyle: "short", timeStyle: "short", hour12: false, timeZone
      }).format(instant);
      output.textContent = getTranslation(locale, "application.step3.dualTime")
        .replace("{{vn}}", formatter("Asia/Ho_Chi_Minh"))
        .replace("{{jp}}", formatter("Asia/Tokyo"));
    }

    function configureContactLinks(locale) {
      const zaloId = marketConfig.messenger.primary.id;
      const available = zaloId && !zaloId.includes("{{");
      document.querySelectorAll("[data-zalo-link]").forEach((link) => {
        if (available) {
          link.href = `https://zalo.me/${encodeURIComponent(zaloId)}`;
          link.removeAttribute("aria-disabled");
          link.removeAttribute("title");
        } else {
          link.removeAttribute("href");
          link.setAttribute("aria-disabled", "true");
          link.title = getTranslation(locale, "application.zaloUnavailable");
        }
      });
    }

    function createReceiptCode() {
      const now = new Date();
      const date = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
      const suffix = String(Math.floor(Math.random() * 1000000)).padStart(6, "0");
      return `AM-${date}-${suffix}`;
    }

    function completeApplication() {
      const code = createReceiptCode();
      document.querySelector("[data-receipt-code]").textContent = code;
      document.querySelector("[data-application-success]").hidden = false;
      applicationForm.hidden = true;
      document.querySelector("[data-form-progress]").hidden = true;
      try {
        sessionStorage.removeItem("andmore-application-draft");
      } catch (error) {}
      refreshIcons();
    }

    function applyLocale(locale) {
      const nextLocale = Object.hasOwn(i18n, locale) ? locale : "vi";
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;

      document.documentElement.lang = nextLocale;
      document.title = getTranslation(nextLocale, "common.pageTitle");
      document.querySelector('meta[name="description"]').content = getTranslation(nextLocale, "common.pageDescription");
      document.getElementById("locale-fonts").href = fontUrls[nextLocale];

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const value = getTranslation(nextLocale, element.dataset.i18n);
        if (typeof value === "string") {
          setLocalizedText(element, value, nextLocale);
        }
      });

      document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
        const value = getTranslation(nextLocale, element.dataset.i18nAriaLabel);
        if (typeof value === "string") {
          element.setAttribute("aria-label", value);
        }
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        const value = getTranslation(nextLocale, element.dataset.i18nPlaceholder);
        if (typeof value === "string") {
          element.placeholder = value;
        }
      });

      document.querySelectorAll("[data-locale-select]").forEach((select) => {
        select.value = nextLocale;
        select.setAttribute("aria-label", getTranslation(nextLocale, "common.languageLabel"));
      });

      renderApplicationChoices(nextLocale);
      if (currentFormStep === 2) renderDocumentUploads(nextLocale);
      document.querySelector("[data-form-progress]").setAttribute("aria-label", getTranslation(nextLocale, "application.progressLabel"));
      document.querySelector("[data-sticky-actions]").setAttribute("aria-label", getTranslation(nextLocale, "sticky.label"));
      document.querySelector('[data-i18n="application.step3.retention"]').textContent = getTranslation(nextLocale, "application.step3.retention")
        .replace("{{n}}", marketConfig.privacy.retentionMonths)
        .replace(nextLocale === "ja" ? "{{方法}}" : "{{cách thức}}", marketConfig.privacy.withdrawalMethod[nextLocale]);
      updateDualTime();
      configureContactLinks(nextLocale);

      updateEligibilityDisplay();
      updateSalaryCalculator();

      const phone = marketConfig.contact.phone;
      document.querySelectorAll("[data-call-link]").forEach((link) => {
        const isConfirmed = phone && !phone.includes("{{");
        link.toggleAttribute("href", isConfirmed);
        if (isConfirmed) {
          link.href = `tel:${phone}`;
          link.removeAttribute("aria-disabled");
          link.removeAttribute("title");
        } else {
          link.removeAttribute("href");
          link.setAttribute("aria-disabled", "true");
          link.title = getTranslation(nextLocale, "header.callUnavailable");
        }
      });

      try {
        sessionStorage.setItem("andmore-locale", nextLocale);
      } catch (error) {}

      refreshIcons();
      requestAnimationFrame(() => {
        const previousScrollBehavior = document.documentElement.style.scrollBehavior;
        document.documentElement.style.scrollBehavior = "auto";
        window.scrollTo(scrollX, scrollY);
        requestAnimationFrame(() => {
          document.documentElement.style.scrollBehavior = previousScrollBehavior;
        });
      });
    }

    document.querySelectorAll("[data-locale-select]").forEach((select) => {
      select.addEventListener("change", (event) => applyLocale(event.target.value));
    });

    document.querySelector("[data-eligibility-form]").addEventListener("change", updateEligibilityDisplay);
    document.querySelector("[data-salary-calculator]").addEventListener("input", updateSalaryCalculator);

    applicationForm.addEventListener("focusout", (event) => {
      if (event.target.name && event.target.required) validateApplicationField(event.target.name);
    });
    applicationForm.addEventListener("input", (event) => {
      if (event.target.name === "interviewTime") updateDualTime();
      saveApplicationDraft();
    });
    applicationForm.addEventListener("change", (event) => {
      if (event.target.matches('input[type="file"]')) {
        addFiles(event.target.dataset.documentKey, event.target.files);
        event.target.value = "";
      } else {
        if (event.target.name) validateApplicationField(event.target.name);
        if (event.target.name === "occupation" && currentFormStep === 2) renderDocumentUploads(document.documentElement.lang);
        if (event.target.name === "interviewTime") updateDualTime();
        saveApplicationDraft();
      }
    });
    applicationForm.addEventListener("click", (event) => {
      const nextButton = event.target.closest("[data-next-step]");
      const previousButton = event.target.closest("[data-previous-step]");
      const removeButton = event.target.closest("[data-remove-document]");
      if (nextButton) {
        const nextStep = Number(nextButton.dataset.nextStep);
        if (currentFormStep !== 1 || validateStep(1)) showFormStep(nextStep);
      }
      if (previousButton) showFormStep(Number(previousButton.dataset.previousStep));
      if (removeButton) {
        const key = removeButton.dataset.removeDocument;
        const index = Number(removeButton.dataset.removeIndex);
        const entries = uploadedFiles.get(key) || [];
        const [removed] = entries.splice(index, 1);
        if (removed?.url) URL.revokeObjectURL(removed.url);
        uploadedFiles.set(key, entries);
        renderFileList(key, document.documentElement.lang);
      }
    });
    applicationForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (isSubmitting || !validateStep(3)) return;
      isSubmitting = true;
      const button = document.querySelector("[data-submit-button]");
      const label = document.querySelector("[data-submit-label]");
      button.disabled = true;
      label.textContent = getTranslation(document.documentElement.lang, "application.step3.submitting");
      const loader = document.createElement("i");
      loader.className = "ic loader-icon";
      loader.dataset.lucide = "loader-circle";
      loader.setAttribute("aria-hidden", "true");
      button.prepend(loader);
      refreshIcons();
      setTimeout(completeApplication, 500);
    });

    document.querySelector("[data-copy-code]").addEventListener("click", async (event) => {
      const code = document.querySelector("[data-receipt-code]").textContent;
      try {
        await navigator.clipboard.writeText(code);
      } catch (error) {}
      event.currentTarget.querySelector("span").textContent = getTranslation(document.documentElement.lang, "application.success.copied");
    });

    const heroImage = document.querySelector("[data-hero-image]");
    const heroImageFrame = document.querySelector("[data-hero-image-frame]");

    function updateHeroImageState() {
      heroImageFrame.classList.toggle("is-missing", !heroImage.naturalWidth);
    }

    heroImage.addEventListener("load", updateHeroImageState);
    heroImage.addEventListener("error", updateHeroImageState);
    if (heroImage.complete) {
      updateHeroImageState();
    }

    const mapImage = document.querySelector("[data-map-image]");
    const mapFrame = document.querySelector("[data-map-frame]");

    function updateMapImageState() {
      mapFrame.classList.toggle("is-missing", !mapImage.naturalWidth);
    }

    mapImage.addEventListener("load", updateMapImageState);
    mapImage.addEventListener("error", updateMapImageState);
    if (mapImage.complete) {
      updateMapImageState();
    }

    document.querySelectorAll(".faq-item").forEach((item) => {
      item.addEventListener("toggle", refreshIcons);
    });

    const menuDisclosure = document.querySelector(".menu-disclosure");
    document.addEventListener("click", (event) => {
      if (menuDisclosure.open && !menuDisclosure.contains(event.target)) menuDisclosure.open = false;
      if (event.target.closest(".menu-dropdown a")) menuDisclosure.open = false;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && menuDisclosure.open) {
        menuDisclosure.open = false;
        menuDisclosure.querySelector("summary").focus();
      }
    });

    const header = document.querySelector(".site-header");
    function updateHeaderShadow() {
      header.classList.toggle("is-scrolled", window.scrollY > 40);
    }

    window.addEventListener("scroll", updateHeaderShadow, { passive: true });

    const stickyActions = document.querySelector("[data-sticky-actions]");
    const heroSection = document.querySelector('[data-section="S1"]');
    function updateStickyActions() {
      stickyActions.classList.toggle("is-visible", heroSection.getBoundingClientRect().bottom < 0);
    }
    window.addEventListener("scroll", updateStickyActions, { passive: true });

    let initialLocale = "vi";
    try {
      initialLocale = sessionStorage.getItem("andmore-locale") || "vi";
    } catch (error) {
      initialLocale = "vi";
    }

    applyLocale(initialLocale);
    restoreApplicationDraft();
    showFormStep(currentFormStep);
    updateHeaderShadow();
    updateStickyActions();
    setupSalaryReveal();
  </script>
</body>
</html>
